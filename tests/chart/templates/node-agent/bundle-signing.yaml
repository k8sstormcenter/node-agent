# Signed-bundle overlay fixtures for component tests (Test_37).
#
# TEST-ONLY key material: these are throwaway keys generated for this test
# chart. The private keys for the "vendor" and "operator" signer identities are
# embedded in tests/component_test.go so the test can sign fragments; the
# trust policy below lists their public-key fingerprints per fragment class.
# The cluster signing key is what node-agent uses to internally re-sign the
# assembled composite. None of this is production key material.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.nodeAgent.name }}-bundle-policy
  namespace: {{ .Values.ksNamespace }}
  labels:
    kubescape.io/ignore: "true"
data:
  trust-policy.json: |
    {
      "classes": {
        "base": {
          "signers": ["key:67705d55b0ec725c13cbe70e62deea1bb830dbb9891e697bcf4c16b0e39c50e1"],
          "allowedSpecPaths": ["architectures", "capabilities", "execs", "opens", "syscalls", "seccompProfile", "endpoints", "imageID", "imageTag", "rulePolicies", "identifiedCallStacks", "labelSelector"]
        },
        "admission": {
          "signers": ["key:36fd360428018bef6b442f7a2eb48f2d52dabbec0dbabe26d8b2ff20707a70dc"],
          "allowedSpecPaths": ["ingress", "egress"]
        },
        "overlay": {
          "signers": ["key:36fd360428018bef6b442f7a2eb48f2d52dabbec0dbabe26d8b2ff20707a70dc"],
          "allowedSpecPaths": ["execs", "opens"]
        }
      }
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.nodeAgent.name }}-bundle-key
  namespace: {{ .Values.ksNamespace }}
  labels:
    kubescape.io/ignore: "true"
type: Opaque
stringData:
  signing-key.pem: |
    -----BEGIN EC PRIVATE KEY-----
    MHcCAQEEIGRRgxlE8n9T965ALQOOo6vocFURgh9w98pLHEwpQx4ToAoGCCqGSM49
    AwEHoUQDQgAEYh2MHZ14I/aj3QMnvfkOi8X/qbIGGH4wAFDaapeCWxI2Sa0DJxf6
    fPqR03AoWSikGXaoTf6ieNdqfNU6yHlhEQ==
    -----END EC PRIVATE KEY-----
