apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: curl-25
  name: curl-25
spec:
  selector:
    matchLabels:
      app: curl-25
  template:
    metadata:
      labels:
        app: curl-25
      annotations:
        kubescape.io/user-defined-profile: curl-25-overlay
    spec:
      containers:
      - name: curl
        image: docker.io/curlimages/curl@sha256:08e466006f0860e54fc299378de998935333e0e130a15f6f98482e9f8dab3058
        command: ["sleep", "infinity"]
