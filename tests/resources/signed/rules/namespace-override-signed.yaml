apiVersion: kubescape.io/v1
kind: Rules
metadata:
  annotations:
    signature.kubescape.io/certificate: 
    signature.kubescape.io/content: 
    signature.kubescape.io/identity: local-key
    signature.kubescape.io/issuer: local
    signature.kubescape.io/signature: MEUCICTVAYcy8R1gpN7zaeUL1ZrZutvQXx0tRkf6ZNQ9xpaBAiEAkjj1k7ARbCLrj/iqCKQ+ZqVbkQxERh9jxahVgpO7mxw=
    signature.kubescape.io/timestamp: "1786469943"
  labels:
    signature.kubescape.io/bundle: bundle37
    signature.kubescape.io/fragment-class: overlay
  name: ct-bundle37-overlay-rules
spec:
  rules:
  - agentVersionRequirement: ""
    description: Bundle-scoped overlay of R0001 for the signed-rules component test
    enabled: true
    expressions:
      message: '''BUNDLE OVERLAY R0001: unexpected process '' + event.comm + '' with
        PID '' + string(event.pid)'
      ruleExpression:
      - eventType: exec
        expression: '!cp.was_executed(event.containerId, (event.exepath != "" ? event.exepath
          : parse.get_exec_path(event.args, event.comm)))'
      uniqueId: event.comm + '_' + event.exepath
    id: R0001
    isTriggerAlert: true
    mitreTactic: TA0002
    mitreTechnique: T1059
    name: Unexpected process launched
    profileDataRequired:
      capabilities: null
      egressAddresses: null
      egressDomains: null
      endpoints: null
      execs: all
      ingressAddresses: null
      ingressDomains: null
      opens: null
      syscalls: null
    profileDependency: 0
    severity: 9
    supportPolicy: false
    tags:
    - context:kubernetes
    - context:container
    - anomaly
    - process
    - exec
    - applicationprofile
