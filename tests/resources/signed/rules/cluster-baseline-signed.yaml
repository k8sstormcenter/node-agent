  - agentVersionRequirement: ""
    description: Detecting use of the LD_PRELOAD/LD_LIBRARY_PATH dynamic-linker hook
      mechanism, or an unexpected write to /etc/ld.so.preload relative to the container's
      application-profile baseline.
    enabled: false
    expressions:
      message: 'eventType == ''exec'' ? ''Process ('' + event.comm + '') is using
        a dynamic linker hook: '' + process.get_ld_hook_var(event.pid) : ''The dynamic
        linker configuration file ('' + event.path + '') was modified by process (''
        + event.comm + '')'''
      ruleExpression:
      - eventType: exec
        expression: event.comm != 'java' && event.containerName != 'matlab' && process.get_ld_hook_var(event.pid)
          != ''
      - eventType: open
        expression: event.path == '/etc/ld.so.preload' && has(event.flagsRaw) && event.flagsRaw
          != 0
      uniqueId: 'eventType == ''exec'' ? ''exec_'' + event.comm : ''open_'' + event.path'
    id: R1011
    isTriggerAlert: true
    mitreTactic: TA0005
    mitreTechnique: T1574.006
    name: ld_preload Mechanism Use or ld.so.preload Modification
