      egressDomains: null
      endpoints: null
      execs: null
      ingressAddresses: null
      ingressDomains: null
      opens:
      - exact: /etc/ld.so.preload
      syscalls: null
    profileDependency: 1
    severity: 5
    supportPolicy: true
