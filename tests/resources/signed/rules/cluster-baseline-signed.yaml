apiVersion: kubescape.io/v1
kind: Rules
metadata:
  annotations:
    signature.kubescape.io/certificate: 
    signature.kubescape.io/content: 
    signature.kubescape.io/identity: local-key
    signature.kubescape.io/issuer: local
    signature.kubescape.io/signature: MEQCIA/tj4PFZYOT/tSGGdNov4YFcGGyu/anR4HvJs05TGrBAiAPLaR30hC5p4aQNEtoEjj4DuRRP5uttySY0ULg7KoK7g==
    signature.kubescape.io/timestamp: "1786469943"
  labels:
    signature.kubescape.io/fragment-class: base
  name: ct-base-rules
spec:
  rules:
  - agentVersionRequirement: ""
    description: Detects unexpected process launches that are not in the baseline
    enabled: true
    expressions:
      message: '''Unexpected process launched: '' + event.comm + '' with PID '' +
        string(event.pid)'
      ruleExpression:
      - eventType: exec
        expression: '!cp.was_executed(event.containerId, (event.exepath != "" ? event.exepath
          : parse.get_exec_path(event.args, event.comm)))'
      uniqueId: event.comm + '_' + event.exepath
    id: R0001
    isTriggerAlert: true
    mitreTactic: TA0002
    mitreTechnique: T1059
    name: Unexpected process launched
    profileDataRequired:
      capabilities: null
      egressAddresses: null
      egressDomains: null
      endpoints: null
      execs: all
      ingressAddresses: null
      ingressDomains: null
      opens: null
      syscalls: null
    profileDependency: 0
    severity: 1
    supportPolicy: false
    tags:
    - context:kubernetes
    - context:container
    - anomaly
    - process
    - exec
    - applicationprofile
  - agentVersionRequirement: ""
    description: Detects unexpected file access that is not in the baseline
    enabled: false
    expressions:
      message: '''Unexpected file access detected: '' + event.comm + '' with PID ''
        + string(event.pid) + '' to '' + event.path'
      ruleExpression:
      - eventType: open
        expression: |
          (event.path.startsWith('/etc/') || event.path.startsWith('/var/log/') || event.path.startsWith('/var/run/') || event.path.startsWith('/run/') || event.path.startsWith('/var/spool/cron/') || event.path.startsWith('/var/www/') || event.path.startsWith('/var/lib/') || event.path.startsWith('/opt/') || event.path.startsWith('/usr/local/') || event.path.startsWith('/app/') || event.path == '/.dockerenv' || event.path == '/proc/self/environ') && !(event.path.startsWith('/run/secrets/kubernetes.io/serviceaccount') ||
            event.path.startsWith('/var/run/secrets/kubernetes.io/serviceaccount') ||
            event.path.startsWith('/tmp'))
          && !cp.was_path_opened(event.containerId, event.path)
      uniqueId: event.comm + '_' + event.path
    id: R0002
    isTriggerAlert: false
    mitreTactic: TA0009
    mitreTechnique: T1005
    name: Files Access Anomalies in container
    profileDataRequired:
      capabilities: null
      egressAddresses: null
      egressDomains: null
      endpoints: null
      execs: null
      ingressAddresses: null
      ingressDomains: null
      opens:
      - prefix: /etc/
      - prefix: /var/log/
      - prefix: /var/run/
      - prefix: /run/
      - prefix: /var/spool/cron/
      - prefix: /var/www/
      - prefix: /var/lib/
      - prefix: /opt/
      - prefix: /usr/local/
      - prefix: /app/
      - exact: /.dockerenv
      - exact: /proc/self/environ
      syscalls: null
    profileDependency: 0
    severity: 1
    supportPolicy: false
    tags:
    - context:kubernetes
    - context:container
    - anomaly
    - file
    - open
    - applicationprofile
  - agentVersionRequirement: ""
    description: Detects unexpected system calls that are not whitelisted by application
      profile
    enabled: true
    expressions:
      message: '''Unexpected system call detected: '' + event.syscallName + '' with
        PID '' + string(event.pid)'
      ruleExpression:
      - eventType: syscall
        expression: '!cp.was_syscall_used(event.containerId, event.syscallName)'
      uniqueId: event.syscallName
    id: R0003
    isTriggerAlert: false
    mitreTactic: TA0002
    mitreTechnique: T1059
    name: Syscalls Anomalies in container
    profileDataRequired:
      capabilities: null
      egressAddresses: null
      egressDomains: null
      endpoints: null
      execs: null
      ingressAddresses: null
      ingressDomains: null
      opens: null
      syscalls: all
    profileDependency: 0
    severity: 1
    supportPolicy: false
    tags:
    - context:kubernetes
    - context:container
    - anomaly
    - syscall
    - applicationprofile
  - agentVersionRequirement: ""
    description: Detects unexpected capabilities that are not whitelisted by application
      profile
    enabled: true
    expressions:
      message: '''Unexpected capability used: '' + event.capName + '' in syscall ''
        + event.syscallName + '' with PID '' + string(event.pid)'
      ruleExpression:
      - eventType: capabilities
        expression: '!cp.was_capability_used(event.containerId, event.capName)'
      uniqueId: event.comm + '_' + event.capName
    id: R0004
    isTriggerAlert: false
    mitreTactic: TA0002
    mitreTechnique: T1059
    name: Linux Capabilities Anomalies in container
    profileDataRequired:
      capabilities: all
      egressAddresses: null
      egressDomains: null
      endpoints: null
      execs: null
      ingressAddresses: null
      ingressDomains: null
      opens: null
      syscalls: null
    profileDependency: 0
    severity: 1
    supportPolicy: false
    tags:
    - context:kubernetes
    - context:container
    - anomaly
    - capabilities
    - applicationprofile
  - agentVersionRequirement: ""
    description: Detecting unexpected domain requests that are not whitelisted by
      application profile.
    enabled: true
    expressions:
      message: '''Unexpected domain communication: '' + event.name + '' from: '' +
        event.containerName'
      ruleExpression:
      - eventType: dns
        expression: '!event.name.endsWith(''.svc.cluster.local.'') && !cp.is_domain_in_egress(event.containerId,
          event.name)'
      uniqueId: event.comm + '_' + event.name
    id: R0005
    isTriggerAlert: false
    mitreTactic: TA0011
    mitreTechnique: T1071.004
    name: DNS Anomalies in container
    profileDataRequired:
      capabilities: null
      egressAddresses: null
      egressDomains: all
      endpoints: null
      execs: null
      ingressAddresses: null
      ingressDomains: null
      opens: null
      syscalls: null
    profileDependency: 0
    severity: 1
    supportPolicy: false
    tags:
    - context:kubernetes
    - context:container
    - dns
    - anomaly
    - networkprofile
  - agentVersionRequirement: ""
    description: Detecting unexpected access to service account token.
    enabled: true
    expressions:
      message: '''Unexpected access to service account token: '' + event.path + ''
        with flags: '' + event.flags.join('','')'
      ruleExpression:
      - eventType: open
        expression: "((event.path.startsWith('/run/secrets/kubernetes.io/serviceaccount')
          && event.path.endsWith('/token')) || \n (event.path.startsWith('/var/run/secrets/kubernetes.io/serviceaccount')
          && event.path.endsWith('/token')) ||\n (event.path.startsWith('/run/secrets/eks.amazonaws.com/serviceaccount')
          && event.path.endsWith('/token')) ||\n (event.path.startsWith('/var/run/secrets/eks.amazonaws.com/serviceaccount')
          && event.path.endsWith('/token'))) &&\n!cp.was_path_opened_with_suffix(event.containerId,
          '/token')\n"
      uniqueId: event.comm
    id: R0006
    isTriggerAlert: true
    mitreTactic: TA0006
    mitreTechnique: T1528
    name: Unexpected service account token access
    profileDataRequired:
      capabilities: null
      egressAddresses: null
      egressDomains: null
      endpoints: null
      execs: null
      ingressAddresses: null
      ingressDomains: null
      opens:
      - suffix: /token
      syscalls: null
    profileDependency: 0
    severity: 5
    state:
      includePrefixes:
      - /run/secrets
      - /var/run/secrets
    supportPolicy: false
    tags:
    - context:kubernetes
    - anomaly
    - serviceaccount
    - applicationprofile
  - agentVersionRequirement: ""
    description: Detecting execution of kubernetes client
    enabled: true
    expressions:
      message: 'eventType == ''exec'' ? ''Kubernetes client ('' + event.comm + '')
        was executed with PID '' + string(event.pid) : ''Network connection to Kubernetes
        API server from container '' + event.containerName'
      ruleExpression:
      - eventType: exec
        expression: '(event.comm == ''kubectl'' || event.exepath.endsWith(''/kubectl''))
          && !cp.was_executed(event.containerId, (event.exepath != "" ? event.exepath
          : parse.get_exec_path(event.args, event.comm)))'
      - eventType: network
        expression: event.pktType == 'OUTGOING' && k8s.is_api_server_address(event.dstAddr)
          && !cp.was_address_in_egress(event.containerId, event.dstAddr)
      uniqueId: 'eventType == ''exec'' ? ''exec_'' + event.comm : ''network_'' + event.dstAddr'
    id: R0007
    isTriggerAlert: false
    mitreTactic: TA0008
    mitreTechnique: T1210
    name: Workload uses Kubernetes API unexpectedly
    profileDataRequired:
      capabilities: null
      egressAddresses: all
      egressDomains: null
      endpoints: null
      execs: all
      ingressAddresses: null
      ingressDomains: null
      opens: null
      syscalls: null
    profileDependency: 0
    severity: 5
    supportPolicy: false
    tags:
    - context:kubernetes
    - exec
    - network
    - anomaly
    - applicationprofile
  - agentVersionRequirement: ""
    description: Detecting reading environment variables from procfs.
    enabled: true
    expressions:
      message: '''Reading environment variables from procfs: '' + event.path + ''
        by process '' + event.comm'
      ruleExpression:
      - eventType: open
        expression: |
          event.path.startsWith('/proc/') &&  event.path.endsWith('/environ') && !cp.was_path_opened_with_suffix(event.containerId, '/environ')
      uniqueId: event.comm
    id: R0008
    isTriggerAlert: true
    mitreTactic: TA0006
    mitreTechnique: T1552.001
    name: Read Environment Variables from procfs
    profileDataRequired:
      capabilities: null
      egressAddresses: null
      egressDomains: null
      endpoints: null
      execs: null
      ingressAddresses: null
      ingressDomains: null
      opens:
      - suffix: /environ
      syscalls: null
    profileDependency: 0
    severity: 5
    state:
      includePrefixes:
      - /proc
    supportPolicy: false
    tags:
    - context:kubernetes
    - context:container
    - anomaly
    - procfs
    - environment
    - applicationprofile
  - agentVersionRequirement: ""
    description: Detecting eBPF program load.
    enabled: true
    expressions:
      message: '''bpf program load system call (bpf) was called by process ('' + event.comm
        + '') with command (BPF_PROG_LOAD)'''
      ruleExpression:
      - eventType: bpf
        expression: event.cmd == uint(5) && !cp.was_syscall_used(event.containerId,
          'bpf')
      uniqueId: event.comm + '_' + 'bpf' + '_' + string(event.cmd)
    id: R0009
    isTriggerAlert: true
    mitreTactic: TA0005
    mitreTechnique: T1218
    name: eBPF Program Load
    profileDataRequired:
      capabilities: null
      egressAddresses: null
      egressDomains: null
      endpoints: null
      execs: null
      ingressAddresses: null
      ingressDomains: null
      opens: null
      syscalls:
      - exact: bpf
    profileDependency: 1
    severity: 5
    supportPolicy: false
    tags:
    - context:kubernetes
    - context:host
    - bpf
    - ebpf
    - applicationprofile
  - agentVersionRequirement: ""
    description: Detecting access to sensitive files.
    enabled: true
    expressions:
      message: '''Unexpected sensitive file access: '' + event.path + '' by process
        '' + event.comm'
      ruleExpression:
      - eventType: open
        expression: event.path.startsWith('/etc/shadow') && !cp.was_path_opened(event.containerId,
          event.path)
      uniqueId: event.comm + '_' + event.path
    id: R0010
    isTriggerAlert: true
    mitreTactic: TA0006
    mitreTechnique: T1005
    name: Unexpected Sensitive File Access
    profileDataRequired:
      capabilities: null
      egressAddresses: null
      egressDomains: null
      endpoints: null
      execs: null
      ingressAddresses: null
      ingressDomains: null
      opens:
      - prefix: /etc/shadow
      syscalls: null
    profileDependency: 1
    severity: 5
    supportPolicy: false
    tags:
    - context:kubernetes
    - context:container
    - context:host
    - files
    - anomaly
    - applicationprofile
  - agentVersionRequirement: ""
    description: Detecting unexpected egress network traffic that is not whitelisted
      by application profile.
    enabled: true
    expressions:
      message: '''Unexpected egress network communication to: '' + event.dstAddr +
        '':'' + string(event.dstPort) + '' using '' + event.proto + '' from: '' +
        event.containerName'
      ruleExpression:
      - eventType: network
        expression: event.pktType == 'OUTGOING' && !net.is_private_ip(event.dstAddr)
          && !cp.was_address_in_egress(event.containerId, event.dstAddr)
      uniqueId: event.dstAddr + '_' + string(event.dstPort) + '_' + event.proto
    id: R0011
    isTriggerAlert: false
    mitreTactic: TA0010
    mitreTechnique: T1041
    name: Unexpected Egress Network Traffic
    profileDataRequired:
      capabilities: null
      egressAddresses: all
      egressDomains: null
      endpoints: null
      execs: null
      ingressAddresses: null
      ingressDomains: null
      opens: null
      syscalls: null
    profileDependency: 0
    severity: 5
    supportPolicy: false
    tags:
    - context:kubernetes
    - context:container
    - whitelisted
    - network
    - anomaly
    - networkprofile
  - agentVersionRequirement: ""
    description: Detects an exec event whose path IS in the application profile but
      whose argv vector does not match any recorded argv pattern for that path. Consumes
      cp.was_executed_with_args, which walks the ExecsByPath projection surface and
      delegates argv comparison to dynamicpathdetector.MatchExecArgs (storage). Stays
      silent when the path is unknown (R0001 covers that case) and when the argv vector
      matches any recorded pattern (including the trailing zero-or-more form and the
      single-arg form); a '*' in a recorded arg is a literal character, not a wildcard.
    enabled: true
    expressions:
      message: '''Unexpected process arguments: '' + event.comm + '' with PID '' +
        string(event.pid) + '' argv='' + event.args.map(a, string(a)).join('' '')'
      ruleExpression:
      - eventType: exec
        expression: cp.was_executed(event.containerId, parse.get_exec_path(event.args,
          event.comm, event.exepath)) && !cp.was_executed_with_args(event.containerId,
          parse.get_exec_path(event.args, event.comm, event.exepath), event.args)
      uniqueId: event.comm + '_' + event.exepath + '_' + event.args.map(a, string(a)).join('
        ')
    id: R0040
    isTriggerAlert: true
    mitreTactic: TA0002
    mitreTechnique: T1059
    name: Unexpected process arguments
    profileDataRequired:
      capabilities: null
      egressAddresses: null
      egressDomains: null
      endpoints: null
      execs: all
      ingressAddresses: null
      ingressDomains: null
      opens: null
      syscalls: null
    profileDependency: 0
    severity: 3
    supportPolicy: false
    tags:
    - context:kubernetes
    - context:container
    - anomaly
    - process
    - exec
    - applicationprofile
  - agentVersionRequirement: ""
    description: Detecting exec calls whose executable path or working directory is
      under /dev/shm, a world-writable memory-backed (tmpfs) directory.
    enabled: true
    expressions:
      message: '''Process executed from /dev/shm: '' + event.exepath + '' in directory
        '' + event.cwd'
      ruleExpression:
      - eventType: exec
        expression: |
          (event.exepath == '/dev/shm' || event.exepath.startsWith('/dev/shm/')) || (event.cwd == '/dev/shm' || event.cwd.startsWith('/dev/shm/')) || (event.args.size() > 0 && (event.args[0] == '/dev/shm' || event.args[0].startsWith('/dev/shm/')))
      uniqueId: event.comm + '_' + event.exepath + '_' + event.pcomm
    id: R1000
    isTriggerAlert: true
    mitreTactic: TA0002
    mitreTechnique: T1059
    name: Process Executed from /dev/shm
    profileDependency: 2
    severity: 8
    supportPolicy: false
    tags:
    - context:kubernetes
    - context:host
    - exec
    - signature
    - malicious
  - agentVersionRequirement: ""
    description: Detecting exec calls of binaries that are not included in the base
      image
    enabled: true
    expressions:
      message: '''Process ('' + event.comm + '') was executed and is not part of the
        image'''
      ruleExpression:
      - eventType: exec
        expression: |
          (event.upperlayer == true ||
           event.pupperlayer == true) &&
          !cp.was_executed(event.containerId, (event.exepath != "" ? event.exepath : parse.get_exec_path(event.args, event.comm)))
      uniqueId: event.comm + '_' + event.exepath + '_' + event.pcomm
    id: R1001
    isTriggerAlert: true
    mitreTactic: TA0005
    mitreTechnique: T1036
    name: Drifted process executed
    profileDataRequired:
      capabilities: null
      egressAddresses: null
      egressDomains: null
      endpoints: null
      execs: all
      ingressAddresses: null
      ingressDomains: null
      opens: null
      syscalls: null
    profileDependency: 1
    severity: 8
    supportPolicy: false
    tags:
    - context:kubernetes
    - context:container
    - exec
    - malicious
    - binary
    - base image
    - applicationprofile
  - agentVersionRequirement: ""
    description: Detecting Kernel Module Load.
    enabled: true
    expressions:
      message: '''Kernel module ('' + event.module + '') loading attempt with syscall
        ('' + event.syscallName + '') was called by process ('' + event.comm + '')'''
      ruleExpression:
      - eventType: kmod
        expression: event.syscallName == 'init_module' || event.syscallName == 'finit_module'
      uniqueId: event.comm + '_' + event.syscallName + '_' + event.module
    id: R1002
    isTriggerAlert: true
    mitreTactic: TA0005
    mitreTechnique: T1547.006
    name: Process tries to load a kernel module
    profileDependency: 2
    severity: 10
    supportPolicy: false
    tags:
    - context:kubernetes
    - context:host
    - kmod
    - kernel
    - module
    - load
  - agentVersionRequirement: ""
    description: Detecting an SSH connection to a non-standard port where the destination
      address is not in the container's learned egress baseline.
    enabled: false
    expressions:
      message: '''SSH connection to unexpected destination on non-standard port: ''
        + event.dstIp + '':'' + string(dyn(event.dstPort))'
      ruleExpression:
      - eventType: ssh
        expression: dyn(event.srcPort) >= 32768 && dyn(event.srcPort) <= 60999 &&
          !(dyn(event.dstPort) in [22, 2022]) && !cp.was_address_in_egress(event.containerId,
          event.dstIp)
      uniqueId: event.comm + '_' + event.dstIp + '_' + string(dyn(event.dstPort))
    id: R1003
    isTriggerAlert: true
    mitreTactic: TA0008
    mitreTechnique: T1021.001
    name: SSH Connection to Unexpected Destination on Non-Standard Port
    profileDataRequired:
      capabilities: null
      egressAddresses: all
      egressDomains: null
      endpoints: null
      execs: null
      ingressAddresses: null
      ingressDomains: null
      opens: null
      syscalls: null
    profileDependency: 1
    severity: 5
    supportPolicy: false
    tags:
    - context:kubernetes
    - context:container
    - ssh
    - connection
    - port
    - malicious
    - networkprofile
  - agentVersionRequirement: ""
    description: Detecting exec calls from mounted paths.
    enabled: true
    expressions:
      message: '''Process ('' + event.comm + '') was executed from a mounted path'''
      ruleExpression:
      - eventType: exec
        expression: '!cp.was_executed(event.containerId, (event.exepath != "" ? event.exepath
          : parse.get_exec_path(event.args, event.comm))) && k8s.get_container_mount_paths(event.namespace,
          event.podName, event.containerName).exists(mount, event.exepath.startsWith(mount)
          || (event.exepath != "" ? event.exepath : parse.get_exec_path(event.args,
          event.comm)).startsWith(mount))'
      uniqueId: event.comm
    id: R1004
    isTriggerAlert: true
    mitreTactic: TA0002
    mitreTechnique: T1059
    name: Process executed from mount
    profileDataRequired:
      capabilities: null
      egressAddresses: null
      egressDomains: null
      endpoints: null
      execs: all
      ingressAddresses: null
      ingressDomains: null
      opens: null
      syscalls: null
    profileDependency: 1
    severity: 5
    supportPolicy: false
    tags:
    - context:kubernetes
    - context:container
    - exec
    - mount
    - applicationprofile
  - agentVersionRequirement: ""
    description: Detecting Fileless Execution
    enabled: true
    expressions:
      message: '''Fileless execution detected: exec call "'' + event.comm + ''" runs
        from a memory-backed source (memfd / /proc/self/fd)'''
      ruleExpression:
      - eventType: exec
        expression: event.exepath.contains('memfd') || event.exepath.startsWith('/proc/self/fd')
          || event.exepath.matches('/proc/[0-9]+/fd/[0-9]+')
      uniqueId: event.comm + '_' + event.exepath + '_' + event.pcomm
    id: R1005
    isTriggerAlert: true
    mitreTactic: TA0005
    mitreTechnique: T1055
    name: Fileless execution detected
    profileDependency: 2
    severity: 8
    supportPolicy: false
    tags:
    - context:kubernetes
    - context:host
    - fileless
    - execution
    - malicious
  - agentVersionRequirement: ""
    description: Detecting use of the unshare system call (a namespace-manipulation
      capability that can be used to escape a container) by a non-runc process, where
      it was not seen in the container's application-profile baseline.
    enabled: true
    expressions:
      message: '''Unshare system call (unshare) was called by process ('' + event.comm
        + '')'''
      ruleExpression:
      - eventType: unshare
        expression: event.pcomm != 'runc' && !cp.was_syscall_used(event.containerId,
          'unshare')
      uniqueId: event.comm + '_' + 'unshare'
    id: R1006
    isTriggerAlert: true
    mitreTactic: TA0004
    mitreTechnique: T1611
    name: Unexpected unshare Syscall in Container
    profileDataRequired:
      capabilities: null
      egressAddresses: null
      egressDomains: null
      endpoints: null
      execs: null
      ingressAddresses: null
      ingressDomains: null
      opens: null
      syscalls:
      - exact: unshare
    profileDependency: 1
    severity: 5
    supportPolicy: false
    tags:
    - context:kubernetes
    - context:container
    - unshare
    - escape
    - unshare
    - anomaly
    - applicationprofile
  - agentVersionRequirement: ""
    description: Detecting XMR Crypto Miners by randomx algorithm usage.
    enabled: true
    expressions:
      message: '''XMR Crypto Miner process: ('' + event.exepath + '') executed'''
      ruleExpression:
      - eventType: randomx
        expression: "true"
      uniqueId: event.exepath + '_' + event.comm
    id: R1007
    isTriggerAlert: true
    mitreTactic: TA0040
    mitreTechnique: T1496
    name: Crypto miner launched
    profileDependency: 2
    severity: 10
    supportPolicy: false
    tags:
    - context:kubernetes
    - context:container
    - crypto
    - miners
    - malicious
  - agentVersionRequirement: ""
    description: Detecting Crypto miners communication by domain
    enabled: true
    expressions:
      message: '''Communication with a known crypto mining domain: '' + event.name'
      ruleExpression:
      - eventType: dns
        expression: event.name in ['2cryptocalc.com.', '2miners.com.', 'antpool.com.',
          'asia1.ethpool.org.', 'bohemianpool.com.', 'botbox.dev.', 'btm.antpool.com.',
          'c3pool.com.', 'c4pool.org.', 'ca.minexmr.com.', 'cn.stratum.slushpool.com.',
          'dash.antpool.com.', 'data.miningpoolstats.stream.', 'de.minexmr.com.',
          'eth-ar.dwarfpool.com.', 'eth-asia.dwarfpool.com.', 'eth-asia1.nanopool.org.',
          'eth-au.dwarfpool.com.', 'eth-au1.nanopool.org.', 'eth-br.dwarfpool.com.',
