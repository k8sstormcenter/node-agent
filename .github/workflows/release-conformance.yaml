name: Release Conformance

run-name: "conformance ${{ inputs.chart_version }} on ${{ inputs.cni }}"

on:
  push:
    branches: [fork-ci]
    paths: [.github/workflows/release-conformance.yaml]
  workflow_dispatch:
    inputs:
      chart_version:
        description: "kubescape-operator chart version to test (e.g. 1.41.0-duckling16)"
        required: true
        type: string
      chart_repo:
        description: "Helm repository serving the chart"
        required: false
        type: string
        default: "https://k8sstormcenter.github.io/helm-charts"
      cni:
        description: "Cluster network: kindnet (kube-proxy, host-side DNAT) or cilium (kube-proxy replacement, socket-LB in the pod)"
        required: false
        type: choice
        default: kindnet
        options:
          - kindnet
          - cilium
      tests:
        description: "Space-separated test names (default: the public set)"
        required: false
        type: string
        default: "Test_01_BasicAlertTest Test_02_AllAlertsFromMaliciousApp Test_06_KillProcessInTheMiddle Test_07_RuleBindingApplyTest Test_08_ContainerProfilePatching Test_11_EndpointTest Test_12_AuthoredMultiSubtypeProfile Test_13_NaturalLearningLifecycle Test_14_RulePoliciesTest Test_15_CompletedApCannotBecomeReadyAgain Test_16_ApNotStuckOnRestart Test_17_ApCompletedToPartialUpdateTest Test_18_ShortLivedJobTest Test_19_AlertOnPartialProfileTest Test_20_AlertOnPartialThenLearnProcessTest Test_21_AlertOnPartialThenLearnNetworkTest Test_22_AlertOnPartialNetworkProfileTest Test_23_RuleCooldownTest Test_24_ProcessTreeDepthTest Test_25_RuleCooldownExactThreshold Test_27_ApplicationProfileOpens Test_28_UserDefinedNetworkNeighborhood Test_29_SignedContainerProfile Test_30_IgnoreExcludeAndLearningDuration Test_31_TamperDetectionAlert Test_32_UnexpectedProcessArguments Test_33_AnalyzeOpensWildcardAnchoring Test_34_NetworkNeighborsCIDRCollapse Test_35_ExecTTYFieldTest Test_36_MultiContainerPerContainerBinding Test_37_SignedBundleOverlay Test_38_SignedRulesBundleOverlay Test_39_SignedRulesUntrustedSignerRejected Test_40_TrustPolicyFailClosed Test_41_SignedBundleNamespaceFreedom Test_42_SignatureStrippedFragmentRejected Test_43_RelativeOpenPathResolution Test_44_TrustAnchorModificationRequiresElevatedRBAC Test_45_RuleSigningZeroAdmittedDetectionOutage Test_46_TrustPolicyReloadLifecycle Test_47_StoredSpecDivergenceInert Test_48_MultiSubtypeGroupedProfileDocument Test_49_EphemeralContainerFullTreatment Test_50_ServiceRefNetworkNeighbor Test_51_ServiceRefIngressR0012 Test_53_DefaultLearnedNetworkFalsePositives Test_56_StackedFragmentReplacement Test_57_ProbeScopedHostIngress Test_58_CompletedProfileSurvivesAgentRestart"

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      node_agent_image: ${{ steps.chart.outputs.node_agent_image }}
      storage_image: ${{ steps.chart.outputs.storage_image }}
    steps:
      - name: Install Helm
        run: |
          curl --retry 5 --retry-all-errors -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
          chmod 700 get_helm.sh
          sudo ./get_helm.sh
      - name: Read the released chart's image pins
        id: chart
        run: |
          for i in 1 2 3 4 5; do
            helm repo add release "${{ inputs.chart_repo }}" --force-update && helm repo update && break
            echo "helm repo add failed (attempt $i), retrying"; sleep 15
          done
          helm pull release/kubescape-operator --version "${{ inputs.chart_version }}" --untar --untardir /tmp/chart
          grep -E '^(version|appVersion):' /tmp/chart/kubescape-operator/Chart.yaml
          NA=$(helm show values /tmp/chart/kubescape-operator | yq '.nodeAgent.image.repository + ":" + .nodeAgent.image.tag')
          ST=$(helm show values /tmp/chart/kubescape-operator | yq '.storage.image.repository + ":" + .storage.image.tag')
          echo "node_agent_image=$NA" >> "$GITHUB_OUTPUT"
          echo "storage_image=$ST" >> "$GITHUB_OUTPUT"
          echo "node-agent: $NA"; echo "storage: $ST"
      - name: Build the matrix
        id: m
        run: |
          echo "matrix=$(echo '${{ inputs.tests }}' | tr -s ' ' '\n' | sed '/^$/d' | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  conformance:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 16
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.resolve.outputs.matrix) }}
    steps:
      - name: Set up Kind
        run: |
          curl --retry 5 --retry-all-errors -Lo ./kind https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-amd64
          chmod +x ./kind
          if [ "${{ inputs.cni }}" = cilium ]; then
            cat > /tmp/kind.yaml <<'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          networking:
            disableDefaultCNI: true
            kubeProxyMode: none
          nodes:
          - role: control-plane
          EOF
            ./kind create cluster --config /tmp/kind.yaml --wait 0s
          else
            ./kind create cluster
          fi
          curl --retry 5 --retry-all-errors -LO "https://dl.k8s.io/release/v1.35.0/bin/linux/amd64/kubectl"
          chmod +x ./kubectl
          sudo mv ./kubectl /usr/local/bin/kubectl

      - name: Install Helm
        run: |
          curl --retry 5 --retry-all-errors -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
          chmod 700 get_helm.sh
          sudo ./get_helm.sh

      - name: Install Cilium
        if: ${{ inputs.cni == 'cilium' }}
        run: |
          API_HOST=$(docker inspect kind-control-plane -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}')
          for i in 1 2 3 4 5; do
            helm repo add cilium https://helm.cilium.io/ --force-update && helm repo update && break
            echo "helm repo add cilium failed (attempt $i), retrying"; sleep 15
          done
          helm upgrade --install cilium cilium/cilium --version 1.18.6 -n kube-system \
            --set kubeProxyReplacement=true --set k8sServiceHost="$API_HOST" --set k8sServicePort=6443 \
            --set ipam.mode=kubernetes --set operator.replicas=1 \
            --set socketLB.enabled=true --set socketLB.hostNamespaceOnly=false
          kubectl -n kube-system rollout status ds/cilium --timeout=300s
          kubectl wait node --all --for=condition=Ready --timeout=120s
          kubectl -n kube-system get pods -o wide

      - name: Install Prometheus and Alertmanager
        run: |
          for i in 1 2 3 4 5; do
            helm repo add prometheus-community https://prometheus-community.github.io/helm-charts --force-update && helm repo update && break
            echo "helm repo add failed (attempt $i), retrying"; sleep 15
          done
          helm upgrade --install prometheus prometheus-community/kube-prometheus-stack --set grafana.enabled=false --namespace monitoring --create-namespace --set prometheus.prometheusSpec.podMonitorSelectorNilUsesHelmValues=false,prometheus.prometheusSpec.serviceMonitorSelectorNilUsesHelmValues=false --set prometheus.prometheusSpec.maximumStartupDurationSeconds=300 --wait --timeout 5m
          kubectl wait --for=condition=Ready pod -l app.kubernetes.io/name=prometheus -n monitoring --timeout=300s

      - name: Take the component tests from the image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PAT: ${{ secrets.DOCKERHUB_PAT }}
        run: |
          echo "$DOCKERHUB_PAT" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
          CT_IMAGE="${{ needs.resolve.outputs.node_agent_image }}-ct"
          docker pull -q "$CT_IMAGE"
          CID=$(docker create "$CT_IMAGE" /ct/component.test)
          docker cp "$CID:/ct" /tmp/ct
          docker rm "$CID" >/dev/null
          ls -la /tmp/ct
          /tmp/ct/component.test -test.list '^${{ matrix.test }}$'

      - name: Install the released chart
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PAT: ${{ secrets.DOCKERHUB_PAT }}
        run: |
          for i in 1 2 3 4 5; do
            helm repo add release "${{ inputs.chart_repo }}" --force-update && helm repo update && break
            echo "helm repo add failed (attempt $i), retrying"; sleep 15
          done
          helm upgrade --install kubescape release/kubescape-operator --version "${{ inputs.chart_version }}" \
            -n kubescape --create-namespace --wait --timeout 10m \
            --set clusterName="$(kubectl config current-context)" \
            --set imagePullSecrets=duckling-pull \
            --set imagePullSecret.server=docker.io \
            --set imagePullSecret.username="$DOCKERHUB_USERNAME" \
            --set imagePullSecret.password="$DOCKERHUB_PAT" \
            --set alertCRD.installDefault=true \
            --set capabilities.runtimeDetection=enable \
            --set 'nodeAgent.config.alertManagerExporterUrls[0]=alertmanager-operated.monitoring.svc.cluster.local:9093' \
            --set nodeAgent.config.stdoutExporter=true \
            --set nodeAgent.config.maxLearningPeriod=2m \
            --set nodeAgent.config.learningPeriod=1m \
            --set nodeAgent.config.updatePeriod=30s \
            --set nodeAgent.config.ruleCooldown.ruleCooldownDuration=0h \
            --set nodeAgent.config.ruleCooldown.ruleCooldownAfterCount=1000000000 \
            --set nodeAgent.config.ruleCooldown.ruleCooldownOnProfileFailure=false
          kubectl -n kubescape rollout status ds/node-agent --timeout=600s
          kubectl -n kubescape rollout status deploy/storage --timeout=600s
          kubectl -n kubescape get cm node-agent -o json | python3 -c '
          import sys,json
          o=json.load(sys.stdin); c=json.loads(o["data"]["config.json"])
          c["profilesCacheRefreshRate"]="5s"; c["celConfigCache"]={"maxSize":250000,"ttl":"1s"}; c["rogueSweepInterval"]="5s"; c["maxDelaySeconds"]=1
          o["data"]["config.json"]=json.dumps(c)
          for f in ("resourceVersion","uid","creationTimestamp","managedFields"): o["metadata"].pop(f,None)
          print(json.dumps(o))' | kubectl apply -f -
          kubectl -n kubescape rollout restart ds/node-agent
          kubectl -n kubescape rollout status ds/node-agent --timeout=600s
          kubectl -n kubescape get pods -o wide
          sleep 5

      - name: Run Port Forwarding
        run: |
          kubectl port-forward svc/alertmanager-operated 9093:9093 -n monitoring &
          kubectl port-forward -n monitoring svc/prometheus-kube-prometheus-prometheus 9090:9090 &
          sleep 5
          curl -sf http://localhost:9093/api/v2/status > /dev/null

      - name: Set unlimited memlock limit
        run: |
          sudo sh -c "ulimit -l unlimited"

      - name: Run test
        run: |
          cd /tmp/ct && ./component.test -test.v -test.run '^${{ matrix.test }}$' -test.timeout 10m

      - name: Print node agent & storage logs
        if: always()
        run: |
          echo "Node agent logs"
          kubectl logs $(kubectl get pods -n kubescape -o name | grep node-agent) -n kubescape -c node-agent | tail -n 2000
          echo "-----------------------------------------"
          echo "Storage logs"
          kubectl logs $(kubectl get pods -n kubescape -o name | grep storage) -n kubescape | tail -n 500
