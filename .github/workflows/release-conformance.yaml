name: Release Conformance

on:
  workflow_dispatch:
    inputs:
      chart_version:
        description: "kubescape-operator chart version to test (e.g. 1.41.0-duckling15)"
        required: true
        type: string
      chart_repo:
        description: "Helm repository serving the chart"
        required: false
        type: string
        default: "https://k8sstormcenter.github.io/helm-charts"
      node_agent_tag:
        description: "Override nodeAgent.image.tag (default: the chart's pin)"
        required: false
        type: string
        default: ""
      storage_tag:
        description: "Override storage.image.tag (default: the chart's pin)"
        required: false
        type: string
        default: ""
      tests:
        description: "go test -run regex"
        required: false
        type: string
        default: "^(Test_01_|Test_07_|Test_08_|Test_11_|Test_27_|Test_28_|Test_33_|Test_34_|Test_36_|Test_48_)"

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tests
        uses: actions/checkout@v4

      - name: Set up Kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-amd64
          chmod +x ./kind
          ./kind create cluster
          curl -LO "https://dl.k8s.io/release/v1.35.0/bin/linux/amd64/kubectl"
          chmod +x ./kubectl
          sudo mv ./kubectl /usr/local/bin/kubectl

      - name: Install Helm
        run: |
          curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
          chmod 700 get_helm.sh
          sudo ./get_helm.sh

      - name: Install Prometheus and Alertmanager
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm upgrade --install prometheus prometheus-community/kube-prometheus-stack --set grafana.enabled=false --namespace monitoring --create-namespace --set prometheus.prometheusSpec.podMonitorSelectorNilUsesHelmValues=false,prometheus.prometheusSpec.serviceMonitorSelectorNilUsesHelmValues=false --set prometheus.prometheusSpec.maximumStartupDurationSeconds=300 --wait --timeout 5m
          kubectl wait --for=condition=Ready pod -l app.kubernetes.io/name=prometheus -n monitoring --timeout=300s

      - name: Install the released chart
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PAT: ${{ secrets.DOCKERHUB_PAT }}
        run: |
          helm repo add release "${{ inputs.chart_repo }}"
          helm repo update
          helm show chart release/kubescape-operator --version "${{ inputs.chart_version }}" | grep -E '^(version|appVersion):'
          OVERRIDES=""
          if [ -n "${{ inputs.node_agent_tag }}" ]; then OVERRIDES="$OVERRIDES --set nodeAgent.image.tag=${{ inputs.node_agent_tag }}"; fi
          if [ -n "${{ inputs.storage_tag }}" ]; then OVERRIDES="$OVERRIDES --set storage.image.tag=${{ inputs.storage_tag }}"; fi
          helm upgrade --install kubescape release/kubescape-operator --version "${{ inputs.chart_version }}" \
            -n kubescape --create-namespace --wait --timeout 10m \
            --set clusterName="$(kubectl config current-context)" \
            --set imagePullSecrets=duckling-pull \
            --set imagePullSecret.server=docker.io \
            --set imagePullSecret.username="$DOCKERHUB_USERNAME" \
            --set imagePullSecret.password="$DOCKERHUB_PAT" \
            --set alertCRD.installDefault=true \
            --set capabilities.runtimeDetection=enable \
            --set 'nodeAgent.config.alertManagerExporterUrls[0]=alertmanager-operated.monitoring.svc.cluster.local:9093' \
            --set nodeAgent.config.stdoutExporter=true \
            --set nodeAgent.config.maxLearningPeriod=2m \
            --set nodeAgent.config.learningPeriod=1m \
            --set nodeAgent.config.updatePeriod=30s \
            --set nodeAgent.config.ruleCooldown.ruleCooldownDuration=0h \
            --set nodeAgent.config.ruleCooldown.ruleCooldownAfterCount=1000000000 \
            --set nodeAgent.config.ruleCooldown.ruleCooldownOnProfileFailure=false \
            $OVERRIDES
          kubectl -n kubescape rollout status ds/node-agent --timeout=600s
          kubectl -n kubescape rollout status deploy/storage --timeout=600s
          kubectl -n kubescape get pods -o wide
          kubectl -n kubescape get rules.kubescape.io,runtimerulealertbindings.kubescape.io -A
          sleep 5

      - name: Run Port Forwarding
        run: |
          ./tests/scripts/port-forward.sh

      - name: Set up Go
        env:
          CGO_ENABLED: 0
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"

      - name: Set unlimited memlock limit
        run: |
          sudo sh -c "ulimit -l unlimited"

      - name: Run tests against the released chart
        run: |
          cd tests && go test -v ./... -run '${{ inputs.tests }}' --timeout=90m --tags=component

      - name: Print node agent & storage logs
        if: always()
        run: |
          echo "Node agent logs"
          kubectl logs $(kubectl get pods -n kubescape -o name | grep node-agent) -n kubescape -c node-agent | tail -n 2000
          echo "-----------------------------------------"
          echo "Storage logs"
          kubectl logs $(kubectl get pods -n kubescape -o name | grep storage) -n kubescape | tail -n 500
